name: CI

on:
  push:
    branches: [main, dev, produccion, 'Dev_*']
  pull_request:
    branches: [main, dev, produccion, 'Dev_*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Verificar (BD, tipos, lint, pruebas, build)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexo
          POSTGRES_PASSWORD: nexo
          POSTGRES_DB: nexo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexo -d nexo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://nexo:nexo@localhost:5432/nexo
      DEV_LOGIN_ENABLED: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks revisa todo el historial

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Buscar secretos en el historial (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz gitleaks
          set +e
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner \
            --report-format json --report-path gitleaks.json 2> gitleaks.log
          codigo=$?
          set -e
          cat gitleaks.log
          if [ "$codigo" -ne 0 ]; then
            # Cada hallazgo como anotación del PR (archivo, línea, regla y commit; el valor va redactado).
            jq -r '.[] | "::error file=\(.File),line=\(.StartLine)::gitleaks \(.RuleID) en el commit \(.Commit[0:7])"' gitleaks.json 2>/dev/null || true
            tail -n 3 gitleaks.log | sed 's/^/::error::gitleaks: /'
            exit "$codigo"
          fi

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Migrar y sembrar (BD vacía)
        run: pnpm db:reset

      - name: Pruebas SQL (deben salir 11 OK)
        run: pnpm db:test

      - name: Pruebas de los procesos de la BD (deben salir 158 OK, P1–P103, chat P104–P129, WhatsApp P150–P169 y autenticación P200–P208)
        run: pnpm db:test:procesos

      - name: Procesos de la BD documentados en docs/08
        run: pnpm procesos:verificar

      - name: Pruebas SQL con psql (forma literal del plan, 0.4)
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f apps/api/db/tests/pruebas.sql 2>&1 | tee salida-pruebas.txt
          total=$(grep -c "NOTICE:  OK" salida-pruebas.txt || true)
          echo "Líneas OK: $total"
          test "$total" -eq 11

      - name: Restablecer la BD para las pruebas de la API
        run: pnpm db:reset

      - name: Tipos de Kysely al día con la BD
        run: |
          pnpm db:tipos
          git diff --exit-code -- apps/api/src/db/tipos.ts || (echo "::error::apps/api/src/db/tipos.ts no coincide con la BD. Ejecuta pnpm db:tipos y súbelo." && exit 1)

      - name: Verificar tipos
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Formato
        run: pnpm format:check

      - name: Pruebas
        run: pnpm test

      - name: Build
        run: pnpm build

      # Fase 5.4 · los 3 flujos críticos en un navegador real (Playwright levanta la API y la web).
      - name: Navegador para las pruebas extremo a extremo
        run: pnpm --filter @nexo/web exec playwright install --with-deps chromium

      - name: Pruebas extremo a extremo (3 flujos)
        run: pnpm --filter @nexo/web e2e
        env:
          CI: 'true'

      - name: Informe de Playwright si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      # Fase 5.4 · semilla de volumen y EXPLAIN de las 7 consultas clave (falla si hay Seq Scan en tablas grandes).
      - name: Rendimiento de las consultas clave (EXPLAIN)
        run: |
          pnpm db:volumen
          pnpm db:explain
