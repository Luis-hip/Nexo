# Nexo · Plantilla de infraestructura de Render (docs/10_Plan_de_Despliegue.md, DEC-027).
# Sintaxis comprobada en https://render.com/docs/blueprint-spec el 2026-11-18.
# SIN secretos: las variables con `sync: false` se piden en el panel al crear el Blueprint.
# Solo se despliega desde la rama `produccion` y solo si la CI pasa.

services:
  - type: web
    name: nexo-api
    runtime: node
    # Región: la API y la BD deben estar en la misma y NO se puede cambiar después de crearlas.
    region: virginia
    # PLAN GRATUITO (decisión del equipo, 2026-11-18). Límites: el servicio se APAGA tras 15 min sin
    # tráfico (la primera petición tarda) y los temporizadores de la API (plazos de elecciones) no
    # corren mientras duerme. Para el chat en tiempo real (Fase 4) habrá que pasar a un plan de pago
    # (0.5c-512mb ≈ $7/mes). Ver docs/operacion.md.
    plan: free
    repo: https://github.com/Luis-hip/Nexo.git
    branch: produccion
    autoDeployTrigger: checksPass
    # `--prod=false`: las migraciones (node-pg-migrate) viven en devDependencies.
    # ⚠ Confirmar en el primer despliegue que `corepack` está disponible en el entorno de Render.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false
    # `preDeployCommand` es solo de planes de pago: en el plan gratuito las migraciones corren al
    # arrancar, con DATABASE_URL_MIGRACIONES. La semilla NO se carga nunca.
    # DEC-006: la API sigue corriendo con tsx (está en dependencies).
    startCommand: pnpm --filter @nexo/api db:migrate && pnpm --filter @nexo/api start
    healthCheckPath: /salud
    domains:
      - api.nexo.lol
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEV_LOGIN_ENABLED
        value: 'false'
      - key: APP_URL
        value: https://app.nexo.lol
      - key: API_URL
        value: https://api.nexo.lol
      # Cadena del dueño de la BD de Render: la usan SOLO las migraciones.
      - key: DATABASE_URL_MIGRACIONES
        fromDatabase:
          name: nexo-bd
          property: connectionString
      # Cadena del rol `nexo_app` (la crea una persona tras migrar; ver docs/operacion.md).
      - key: DATABASE_URL
        sync: false
      # Render genera un valor aleatorio de 256 bits (base64, 44 caracteres).
      - key: SESSION_SECRET
        generateValue: true
      # 64 caracteres hexadecimales: `openssl rand -hex 32`. Distinta de local y de CI.
      - key: ENCRYPTION_KEY
        sync: false
      # Fase 5 · correos de la autenticación (DEC-AUTH-1). Sin clave no se envían correos: se puede
      # registrar y entrar, pero no recuperar la contraseña ni verificar el correo.
      - key: RESEND_API_KEY
        sync: false
      - key: CORREO_REMITENTE
        value: Nexo <no-responder@nexo.lol>
      # Fase 4 · WhatsApp (DEC-WA-1). `simulado` no llama a Meta. `real` envía mensajes de verdad y
      # exige WHATSAPP_TOKEN, WHATSAPP_PHONE_ID, WHATSAPP_APP_SECRET y WHATSAPP_VERIFY_TOKEN
      # (ponerlas a mano en Render): solo cuando el equipo lo decida y haya cuenta OBA.
      - key: WHATSAPP_PROVIDER
        value: simulado

databases:
  - name: nexo-bd
    region: virginia
    # PLAN GRATUITO. ⚠ La BD gratuita EXPIRA a los 30 días de crearse y NO tiene copias de seguridad
    # (docs/10, sección 3): antes de esa fecha hay que pasar a un plan de pago o exportar los datos.
    # Alternativa de pago: 0.1c-256mb (~$10.50/mes con el disco por defecto).
    plan: free
    postgresMajorVersion: '16'
    databaseName: nexo
    # ⚠ Acceso externo: no se fija `ipAllowList`. Para poner la contraseña de `nexo_app` hace falta
    # conectarse una vez desde fuera; después restringir el acceso (docs/operacion.md).
