services:
  db:
    image: postgres:16
    container_name: nexo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo
      POSTGRES_DB: nexo
    ports:
      - '5432:5432'
    volumes:
      - nexo-db-datos:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexo -d nexo']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexo-db-datos:
